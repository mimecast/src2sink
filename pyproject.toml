[project]
name = "src2sink"
version = "3.0.0"
description = "Cross-repository source-to-sink metabase for LLM-assisted SAST"
authors = [{ name = "Brett Crawley" }]
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sast", "static-analysis", "taint-analysis", "security", "tree-sitter", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Kept deliberately small: this package is installed into other people's
# environments, so every runtime dependency is audited surface (SC-1 / TA-011).
# Anything listed here must be imported somewhere under src2sink/.
dependencies = [
    "defusedxml>=0.7.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Homepage = "https://github.com/mimecast/src2sink"
Repository = "https://github.com/mimecast/src2sink"
Issues = "https://github.com/mimecast/src2sink/issues"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.0",
    "pip-audit>=2.7.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src2sink*"]

# Ship the PEP 561 marker so downstream consumers actually get the annotations
# the "Typing :: Typed" classifier advertises (mypy --strict is a CI gate).
[tool.setuptools.package-data]
src2sink = ["py.typed"]

[project.scripts]
src2sink-build = "src2sink.build_metabase_v2:main"
src2sink-trace = "src2sink.trace:main"
src2sink-trace-batch = "src2sink.trace_batch:main"
src2sink-curate = "src2sink.curate_internal_libraries:main"
src2sink-baseline = "src2sink.record_fleet_baseline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported and gated on every run. The global floor ratchets: it is
# set just under current coverage so it catches a real regression, and is raised
# when coverage rises. Per-module floors live in tests/test_zz_security_coverage_gate.py
# (security modules at 90%, detection modules at 88%), since coverage.py has a
# single global fail_under and no per-module concept.
addopts = "--cov=src2sink --cov-report=term-missing --cov-fail-under=85"
markers = [
    "fleet: fleet-wide regression (needs metabase/repos v2 JSONs)",
]

[tool.coverage.run]
source = ["src2sink"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
# Strict from the start on the shipped package + CI scripts. Tests are excluded:
# they lean on pytest fixtures and deliberately malformed fixture data, where
# full annotation buys little. `mypy` runs as its own CI job (see ci.yml).
files = ["src2sink", "scripts"]
strict = true
pretty = true

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) + the core pycodestyle checks (E4 imports,
# E7 statement, E9 syntax). Deliberately NOT enabling the line-length / whitespace
# style families (E1/E2/E5, W) — turning those on is a large, separate reformat.
# target-version is inferred from project.requires-python.
#
# D1xx are the docstring *presence* rules: every module, class and public function
# must be documented. The rest of the D family is deliberately left off — D401
# ("imperative mood") would require rewriting 23 predicate docstrings from
# "True when the receiver names a database handle" to "Return True when…", which
# is noise rather than clarity for a boolean-returning function.
#
# PLC0415 keeps imports at module level. 26 had drifted into function bodies and
# only one was load-bearing; the rest were habit, including a constant that the
# same package already imported at the top elsewhere. The rule has no autofix, so
# it reports rather than moves — which is what makes it safe here: a real import
# cycle must be answered with a `# noqa: PLC0415` naming the cycle, not silently
# rewritten. Note that isort (`I`) does NOT cover this; it only orders the
# top-level block and leaves a function-level import exactly where it sits.
select = ["E4", "E7", "E9", "F", "D1", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names and module docstrings; requiring
# one on every fixture helper adds ceremony without adding information.
#
# Tests and gate scripts also import inside functions on purpose — to read a
# module fresh after mutating config, or to assert on import behaviour itself.
# PLC0415 protects the package, whose import graph is what a cycle can break.
"tests/*" = ["D1", "PLC0415"]
"scripts/*" = ["PLC0415"]
