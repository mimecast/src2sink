[project]
name = "src2sink"
version = "1.0.0"
description = "Add your description here"
authors = [{ name = "Brett Crawley" }]
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "defusedxml>=0.7.1",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.0",
    "pip-audit>=2.7.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src2sink*"]

[project.scripts]
src2sink-build = "src2sink.build_metabase_v2:main"
src2sink-trace = "src2sink.trace:main"
src2sink-trace-batch = "src2sink.trace_batch:main"
src2sink-curate = "src2sink.curate_internal_libraries:main"
src2sink-baseline = "src2sink.record_fleet_baseline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported and gated on every run (Phase E). Current coverage ~82%.
addopts = "--cov=src2sink --cov-report=term-missing --cov-fail-under=80"
markers = [
    "fleet: fleet-wide regression (needs metabase/repos v2 JSONs)",
]

[tool.coverage.run]
source = ["src2sink"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
# Strict from the start on the shipped package + CI scripts. Tests are excluded:
# they lean on pytest fixtures and deliberately malformed fixture data, where
# full annotation buys little. `mypy` runs as its own CI job (see ci.yml).
files = ["src2sink", "scripts"]
strict = true
pretty = true

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) + the core pycodestyle checks (E4 imports,
# E7 statement, E9 syntax). Deliberately NOT enabling the line-length / whitespace
# style families (E1/E2/E5, W) — turning those on is a large, separate reformat.
# target-version is inferred from project.requires-python.
select = ["E4", "E7", "E9", "F"]
