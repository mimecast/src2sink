name: Release

# Publishes to PyPI when a v* tag is pushed, using PyPI Trusted Publishing
# (OIDC) — there is no API token anywhere in this repository or its secrets.
#
#   build   → build sdist + wheel from the tagged tree, refuse to continue if the
#             tag and pyproject version disagree
#   publish → exchange the workflow's OIDC identity for a short-lived PyPI
#             credential and upload. The only job with id-token: write.
#   release → attach the same artefacts to the GitHub release, with the
#             changelog section as the body. The only job with contents: write.
#
# PyPI must be told to trust this workflow first — see docs/releasing.md §0.
# The publisher is matched on (owner, repository, workflow filename, environment),
# so renaming this file or the environment breaks publishing until PyPI is updated.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - name: Check the tag matches the packaged version
        # A tag/version mismatch would publish a version nobody can trace back to
        # a tag — and PyPI will not let you take it back.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c \
            'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$version"
          test "$tag" = "$version"
      - name: Build
        run: uv build
      - name: Check metadata
        run: uv run --no-project --with twine twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment is half of the trusted-publisher match, and it is where a
    # required reviewer can be added if you ever want releases gated on approval.
    environment:
      name: pypi
      url: https://pypi.org/p/src2sink
    permissions:
      id-token: write # mint the OIDC token PyPI exchanges for an upload credential
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        # --trusted-publishing always: fail loudly rather than silently falling
        # back to looking for a token that does not exist.
        run: uv publish --trusted-publishing always dist/*

  release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach the artefacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f' CHANGELOG.md > release-notes.md
          test -s release-notes.md  # an empty body means the changelog was not updated
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "src2sink ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
